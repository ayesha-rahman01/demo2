<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div>
        <h1>Form</h1>

        <form action="WelcomePage.html" target="_blank">

            <fieldset>
                <legend>Enter Your Details</legend>

            <label for="name"> Full Name: </label>
            <input type="text" id="name" placeholder="Enter your name" required>
            <br><br>

            <label for="email"> Email: </label>
            <input type="email" id="email" placeholder="Enter your Email" required>
            <br><br>

            <label for="password"> Password: </label>
            <input type="password" id="password" placeholder="Enter your password" required>
            <br><br>

            <label for="checkbox"> Are you 18+: </label>
            <input type="checkbox" id="checkbox" required>
            <br><br>

            <label for="number"> Enter Your Number: </label>
            <input type="number" id="number" placeholder="Enter Your Number" required min="0" minlength="10" maxlength="10">
            <br><br>

            <label for="male">Gender: </label>
            <label for="male">Male </label>
            <input type="radio" name="gender" id="male">
            <label for="female">Female </label>
            <input type="radio" name="gender" id="female">
            <br><br>

            <label for="DOB"> Enter Your DOB: </label>
            <input type="date" id="DOB" required>
            <br><br>

            <label for="file"> Upload Photo: </label>
            <input type="file" id="file" required>
            <br><br>

            <label for="city">Select Your City: </label>
            <select name="" id="city">
                <option value="">delhi</option>
                <option value="">mumbai</option>
                <option value="">kolkata</option>
                <option value="">patna</option>
                <option value="">pakistan</option>
                <option value="">noida</option>
            </select>
            <br><br>

            <!-- <input type="submit" name="" id=""> -->
            <button type="submit"> Submit Form</button>
            </fieldset>

        </form>

    </div>
    
</body>

</html>
