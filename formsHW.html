<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Novel Services Login</h1>
    <form action="">
    <label for="username">Username: </label>
    <input type="text" id="username">
    <br><br>

    <label for="password">Password: </label>
    <input type="password" id="password">
    <br><br>

    <label for="city">City of Employment: </label>
    <input type="text" id="city">
    <br><br>
    
    <label for="server">Web Server:</label>
    <select name="" id="server">
        <option value="">Choose a server</option>
        <option value="">abc</option>
        <option value="">xyz</option>
        <option value="">lmn</option>
        <option value="">pqr</option>
    </select>
    <br><br>

    <label for="admin">Please specify your role: </label>
    <br>
    <label for="admin">Admin</label>
    <input type="radio" name="role" id="admin"><br>
    <label for="engineer">Engineer</label>
    <input type="radio" name="role" id="engineer"><br>
    <label for="manager">Manager</label>
    <input type="radio" name="role" id="manager"><br>
    <label for="guest">Guest</label>
    <input type="radio" name="role" id="guest"><br>
    <br><br>

    <label for="mail">Single Sign-on to the following: </label>
    <br>
    <label for="mail">Mail</label>
    <input type="checkbox" style="" name="sign" id="mail"><br>
    <label for="payroll">Payroll</label>
    <input type="checkbox" name="sign" id="payroll"><br>
    <label for="service">Self-service</label>
    <input type="checkbox" name="sign" id="service"><br>
    <br><br>

    <button>Login</button>
    <button>Reset</button>
    </form>
</body>
</html>
