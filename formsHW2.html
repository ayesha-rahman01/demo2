<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Pete's Pizza Delivery</h1>
    <form action="">
        <fieldset>
            <legend>Customer Details</legend>

            <label for="name">Name: </label>
            <input type="text" id="name" required>
            <br><br>

            <label for="address">Address: </label>
            <input type="text" id="address" required>
            <br><br>

            <label for="town/city">Town/city: </label>
            <input type="text" id="town/city" required>
            <br><br>

            <label for="Postcode">Postcode: </label>
            <input type="text" id="Postcode" required>
            <br><br>

            <label for="Tel">Tel: </label>
            <input type="number" id="Tel" required>
            <br><br>

            <label for="Email">Email: </label>
            <input type="email" id="Email" required>
            <br><br>
        </fieldset>
    </form>

    <form action="">
        <fieldset>
            <legend>Topping</legend>

            <label for="margherita">Margherita </label>
            <input type="radio" id="margherita" required>
            <br>

            <label for="four">Four Seasons </label>
            <input type="radio" id="four" required>
            <br>

            <label for="meat">Meat Feast </label>
            <input type="radio" id="meat" required>
            <br>
        </fieldset>
    </form>

    <form action="">
        <fieldset>
            <legend>Size</legend>

            <label for="Small">Small </label>
            <input type="radio" id="Small" required>
            <br>

            <label for="Medium">Medium </label>
            <input type="radio" id="Medium" required>
            <br>

            <label for="large">Large </label>
            <input type="radio" id="large" required>
            <br>
        </fieldset>
    </form>

    <form action="">
        <fieldset>
            <legend>Extras</legend>

            <label for="Mushrooms">Mushrooms </label>
            <input type="checkbox" id="Mushrooms" required>
            <br>

            <label for="Green peppers">Green peppers </label>
            <input type="checkbox" id="Green peppers" required>
            <br>

            <label for="Anchovies">Anchovies </label>
            <input type="checkbox" id="Anchovies" required>
            <br>

            <label for="Extra cheese">Extra cheese </label>
            <input type="checkbox" id="Extra cheese" required>
            <br>
        </fieldset>
    </form>
</body>

</html>
